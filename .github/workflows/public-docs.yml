name: Public-document integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r examples/fastapi_docs/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/fastapi_docs/run.py
      - run: python examples/fastapi_docs/run.py --fixed --output artifacts/fastapi-docs-fixed
      - uses: actions/upload-artifact@v4
        with:
          name: public-docs-evidence
          path: |
            artifacts/fastapi-docs/
            artifacts/fastapi-docs-fixed/
